version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyvault-postgres
    restart: always
    environment:
      POSTGRES_USER: studyvault
      POSTGRES_PASSWORD: studyvault_secret_password
      POSTGRES_DB: studyvault_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: studyvault-adminer
    restart: always
    ports:
      - '8080:8080'

volumes:
  postgres_data:
