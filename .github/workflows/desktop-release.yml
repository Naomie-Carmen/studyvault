name: Desktop Release (Tauri)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `StudyVault Desktop ${context.ref.replace('refs/tags/', '')}`,
              body: 'Mise à jour automatique StudyVault.',
              draft: true,
              prerelease: false
            });
            return data.id;

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      VITE_API_BASE_URL: https://studyvault-api-knof.onrender.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Extract version from tag
        id: version
        shell: powershell
        run: |
          $tagName = $env:GITHUB_REF -replace 'refs/tags/',''
          $version = $tagName -replace '^v',''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build + sign Tauri + upload assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: './desktop'
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ steps.version.outputs.tag_name }}
          releaseName: 'StudyVault ${{ steps.version.outputs.tag_name }}'
          releaseBody: 'Mise à jour automatique StudyVault.'

  publish-release:
    needs: [create-release, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const release_id = ${{ needs.create-release.outputs.release_id }};
            let attempts = 0;
            const maxAttempts = 3;
            while (attempts < maxAttempts) {
              try {
                attempts++;
                console.log(`Publishing release ${release_id} (Attempt ${attempts}/${maxAttempts})...`);
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release_id,
                  draft: false
                });
                console.log(`Release ${release_id} published successfully!`);
                return;
              } catch (error) {
                console.error(`Attempt ${attempts} failed: ${error.message}`);
                if (attempts < maxAttempts) {
                  console.log('Waiting 10 seconds before retrying...');
                  await new Promise((resolve) => setTimeout(resolve, 10000));
                } else {
                  throw error;
                }
              }
            }