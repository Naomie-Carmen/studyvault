name: Desktop Release (Tauri)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      VITE_API_BASE_URL: https://studyvault-api-knof.onrender.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build + sign Tauri + create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: './desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'StudyVault ${{ github.ref_name }}'
          releaseBody: 'Mise à jour automatique StudyVault.'
          releaseDraft: false
          prerelease: false