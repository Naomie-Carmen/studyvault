[package]
name = "studyvault-desktop"
version = "1.0.0"
description = "StudyVault SaaS Desktop Application"
authors = ["StudyVault Team <dev@studyvault.fr>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.4", features = [] }

[dependencies]
tauri = { version = "1.6.2", features = [ "shell-open", "updater", "dialog-ask", "dialog-message" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# default custom-protocol feature required for production builds
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
